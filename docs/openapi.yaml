openapi: 3.0.3
info:
  title: FOSER Portal API
  version: 1.0.0
  description: Versioned REST API for the FOSER portal.
servers:
  - url: /api/v1
security:
  - sanctumBearer: []
paths:
  /auth/login:
    post:
      security: []
      summary: Create a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201': { description: Token created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      summary: Current authenticated user
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me:
    get:
      summary: Current authenticated user (alias of auth/me)
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    delete:
      summary: Revoke the current token
      responses:
        '204': { description: Token revoked }
  /{resource}:
    parameters:
      - $ref: '#/components/parameters/Resource'
    get:
      summary: Paginated resource collection
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Direction' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /{resource}/{id}:
    parameters:
      - { $ref: '#/components/parameters/Resource' }
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Retrieve a resource
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Resource not found }
  /statistics:
    get:
      summary: Dashboard statistics
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /statistics/regions:
    get:
      security: []
      summary: Public aggregated statistics by region
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /results:
    get:
      summary: Published results visible to the caller (owner, assigned evaluator, tenant or authorized staff)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /awards:
    get:
      summary: Active awards for the beneficiary or finance-authorized staff
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /disbursements:
    get:
      summary: Financial disbursements (finance.view required)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: status, in: query, schema: { type: string, maxLength: 30 } }
        - { name: application_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /news:
    get:
      security: []
      summary: Search published public news
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Page' }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /news/{slug}:
    get:
      security: []
      summary: Retrieve a published public news article
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '404': { description: Article unavailable }
  /public/documents:
    get:
      security: []
      summary: Search published public documents without exposing storage paths
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
        - { name: year, in: query, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { name: language, in: query, schema: { type: string, maxLength: 10 } }
        - { $ref: '#/components/parameters/Page' }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /search:
    get:
      security: []
      summary: Search published public FOSER content
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: type, in: query, schema: { type: string, enum: [news, call, program, document, event, partner, testimonial] } }
        - { $ref: '#/components/parameters/Page' }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /events:
    get:
      security: []
      summary: List published events
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /partners:
    get:
      security: []
      summary: List published partners
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /testimonials:
    get:
      security: []
      summary: List published consented testimonials
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /assistant/ask:
    post:
      security: []
      summary: Answer from public FOSER sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQuestion'
      responses:
        '200': { $ref: '#/components/responses/AssistantResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /documents/{id}/download:
    get:
      summary: Securely download a published document
      responses:
        '200': { description: File stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Document is unavailable }
  /researchers/me:
    get:
      summary: Current researcher profile
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /researchers/projects:
    get:
      summary: Projects owned by or shared with the authenticated researcher
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: status, in: query, schema: { type: string, maxLength: 30 } }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /university/students:
    get:
      summary: Students belonging to the authenticated university only
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Search' }
        - { name: status, in: query, schema: { type: string, maxLength: 40 } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /university/applications:
    get:
      summary: Applications belonging to the authenticated university only
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: status, in: query, schema: { type: string, maxLength: 40 } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /candidatures:
    servers:
      - url: /api/candidate
    get:
      summary: Current student’s applications
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: status, in: query, schema: { type: string, maxLength: 40 } }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a student application draft
      responses:
        '201': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /assignments:
    servers:
      - url: /api/evaluator
    get:
      summary: Evaluations assigned to the current evaluator
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: status, in: query, schema: { type: string, maxLength: 30 } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assignments/{id}:
    servers:
      - url: /api/evaluator
    get:
      summary: Retrieve an evaluation assigned to the authenticated evaluator
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Assignment is not assigned to caller }
  /candidatures/{id}:
    servers:
      - url: /api/candidate
    get:
      summary: Retrieve an application owned by the authenticated student
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Application is not owned by caller }
    put:
      summary: Update an owned editable application draft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateApplicationUpdate' }
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Application is not owned by caller }
        '422': { $ref: '#/components/responses/ValidationError' }
  /applications/{application}/submit:
    servers:
      - url: /api
    post:
      summary: Submit the authenticated student’s application draft
      parameters:
        - { name: application, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Application is not owned by caller }
        '422': { $ref: '#/components/responses/ValidationError' }
  /university/applications/{application}/validate:
    post:
      summary: Validate an application in the authenticated university tenant
      parameters:
        - { name: application, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/SingleResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Application is outside the caller tenant }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    Resource: { name: resource, in: path, required: true, schema: { type: string, enum: [students, universities, researchers, programs, calls, applications, documents, evaluations, research-projects, payments, notifications, claims] } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
    Sort: { name: sort, in: query, schema: { type: string } }
    Direction: { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    CandidateApplicationUpdate:
      type: object
      required: [project_title, summary, description, domain, objectives, methodology, calendar, budget]
      properties:
        project_title: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 2000 }
        description: { type: string, maxLength: 10000 }
        domain: { type: string, maxLength: 255 }
        objectives: { type: string, maxLength: 5000 }
        methodology: { type: string, maxLength: 10000 }
        calendar: { type: string, maxLength: 5000 }
        budget: { type: number, minimum: 0 }
        team: { type: string, nullable: true, maxLength: 5000 }
        applicant_note: { type: string, nullable: true, maxLength: 5000 }
    ApiResponse:
      type: object
      required: [success, data, message, errors, pagination]
      properties:
        success: { type: boolean }
        data: {}
        message: { type: string, nullable: true }
        errors: { type: object, nullable: true, additionalProperties: { type: array, items: { type: string } } }
        pagination: { $ref: '#/components/schemas/Pagination' }
        meta: { allOf: [{ $ref: '#/components/schemas/Pagination' }], deprecated: true, description: Backward-compatible alias for pagination }
    Pagination:
      type: object
      nullable: true
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    AssistantQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 1000 }
    AssistantResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            answer: { type: string, nullable: true }
            confidence: { type: number, format: float }
            refused: { type: boolean }
            sources: { type: array, items: { type: object } }
  responses:
    Collection:
      description: Standard paginated response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    SingleResource:
      description: Standard resource response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Insufficient permission }
    ValidationError: { description: Validation failed }
